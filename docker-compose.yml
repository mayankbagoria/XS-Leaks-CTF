version: '3.8'

services:
  xssi-easy:
    build:
      context: ./xssi/xssi-easy
    container_name: ctf-xssi-easy
    ports:
      - "8001:8000"
    environment:
      - VICTIM_PORT=3000
      - PORTAL_PORT=8000
      - FLAG=${FLAG_XSSI_EASY:-CTF{xss1_gl0b4l_v4r_d3f1n3_pr0p3rty_pwn3d}}
    networks:
      - net_xssi_easy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  xssi-medium:
    build:
      context: ./xssi/xssi-medium
    container_name: ctf-xssi-medium
    ports:
      - "8002:8000"
    environment:
      - VICTIM_PORT=3000
      - PORTAL_PORT=8000
      - FLAG=${FLAG_XSSI_MEDIUM:-CTF{xss1_funct10n_c4ll_pr0t0_0v3rr1d3_succ3ss}}
    networks:
      - net_xssi_medium
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  xssi-hard:
