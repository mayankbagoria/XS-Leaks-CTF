      - PORTAL_PORT=8000
      - FLAG=${FLAG_XSSI_HARD:-CTF{xss1_js0n_synt4x_3rr0r_t1m1ng_0r4cl3}}
    networks:
      - net_xssi_hard
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  cache-easy:
    build:
      context: ./cache-based-leaks/cache-easy
    container_name: ctf-cache-easy
    ports:
      - "8004:8000"
    environment:
      - VICTIM_PORT=3000
      - PORTAL_PORT=8000
      - FLAG=${FLAG_CACHE_EASY:-CTF{c4ch3_t1m1ng_s1ngl3_b1t_v1s1t3d}}
    networks:
      - net_cache_easy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  cache-medium:
    build:
      context: ./cache-based-leaks/cache-medium
    container_name: ctf-cache-medium
    ports:
      - "8005:8000"
    environment:
      - VICTIM_PORT=3000
      - PORTAL_PORT=8000
      - FLAG=${FLAG_CACHE_MEDIUM:-CTF{c4ch3_v1s1t_0rd3r_s3qu3nc3_l34k3d}}
    networks:
      - net_cache_medium
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  cache-hard:
    build:
      context: ./cache-based-leaks/cache-hard
    container_name: ctf-cache-hard
    ports:
      - "8006:8000"
    environment:
      - VICTIM_PORT=3000
      - PORTAL_PORT=8000
      - FLAG=${FLAG_CACHE_HARD:-CTF{d0ubl3_k3y3d_c4ch3_byp4ss_m4st3r}}
    networks:
      - net_cache_hard
